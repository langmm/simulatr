name: Run tests

on:
  release:
    types: [created]
  push:
    branches-ignore:
     - gh-pages
    tags:
     - '*'
  schedule:
    - cron: 0 10 * * 1  # 3AM PST
  workflow_dispatch:

jobs:
  lint:
    name: Lint the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          environments: dev
      - name: Lint
        run: pixi run -e dev lint

  test:
    name: Run tests on ${{ matrix.os }} for Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - python-version: "3.10"
            pixi-environment: py310
          - python-version: "3.11"
            pixi-environment: py311
          - python-version: "3.12"
            pixi-environment: py312
          - python-version: "3.13"
            pixi-environment: py313
          - python-version: "3.14"
            pixi-environment: py314
            os: ubuntu-latest
          - python-version: "3.14"
            pixi-environment: py314
            os: macos-latest
          - python-version: "3.14"
            pixi-environment: py314
            os: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          environments: ${{ matrix.pixi-environment }}
      - name: Install apsimx
        run: pixi run -e ${{ matrix.pixi-environment }} install-apsimx
      - name: Run tests
        run: pixi run -e ${{ matrix.pixi-environment }} test -sv
        timeout-minutes: 2

  docs:
    name: Build the docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          environments: dev
      - name: Build docs
        run: pixi run -e dev docs

  all_tests_passed:
    runs-on: ubuntu-latest
    name: All tests passed
    needs: [lint, test, docs]
    if: always()
    steps:
      - name: All tests ok
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: exit 0
      - name: Some tests failed
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1
