[bdist_wheel]
universal = 1

[build-system]
requires = [
  "setuptools >= 61.0",
  "setuptools_scm",
]
build-backend = "setuptools.build_meta"

[project]
name = "simulatr"
dynamic = [
  "version",
  "readme",
]
dependencies = [
    "fastapi",
    "gymnasium",
    "msgpack",
    "numpy>=1.13.0",
    "pandas",
    "psutil",
    "pydantic",
    "pydantic-settings",
    "pyzmq",
    "requests",
]

description = "Gym environment for reinforcement learning using ApsimX"
license-files = ["LICEN[CS]E*"]
license = "BSD-3-Clause"
keywords = [
  "apsim", "apsimx", "simulatr",
  "reinforcement leanring", "machine learning",
]
authors = [
  { name="Meagan Lang", email="langmm.astro@gmail.com" },
]
maintainers = [
  { name="Meagan Lang", email="langmm.astro@gmail.com" },
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
requires-python = ">= 3.10"

# [project.scripts]
[project.entry-points.console_scripts]
simulatr = "simulatr.cli:main"

[project.urls]
Homepage = "https://github.com/langmm/simulatr"
Documentation = "https://github.com/langmm/simulatr"
Repository = "https://github.com/langmm/simulatr"
Issues = "https://github.com/langmm/simulatr/issues"
Changelog = "https://github.com/langmm/simulatr/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  'build',
  'flake8',
  'git-changelog',
  'myst-parser',
  'pytest',
  'pytest-cov',
  'sphinx',
  'tox',
]

[tool.setuptools]
include-package-data = true
packages = ["simulatr"]

[tool.setuptools.package-data]
simulatr = ["data/*"]

[tool.setuptools_scm]
tag_regex = "^v(?P<version>[0-9]+\\.[0-9]+\\.[0-9]+)$"
# scm.git.pre_parse = "fail_on_shallow"
# version_scheme = "only-version"
fallback_version = "0.0.1"
scm.git.describe_command = ["git", "describe", "--tags", "--long", "--match", "v*"]
version_file = "simulatr/_version.py"

[tool.setuptools.dynamic]
readme = {file = ["README.md", "CHANGELOG.md"]}

[tool.flake8]
max-line-length = 88

[tool.pytest.ini_options]
minversion = "6.0"
norecursedirs = [
  ".*", "build", "dist", "CVS", "_darcs", "{arch}", "*.egg",
]
testpaths = "tests" 
filterwarnings = [
  "error",
  # Error from pandas use of tzinfo
  "ignore:((.|\n)*)datetime\\.datetime\\.utcfromtimestamp((.|\n)*):DeprecationWarning:pytz.*",
  "ignore:((.|\n)*)datetime\\.datetime\\.utcfromtimestamp((.|\n)*):DeprecationWarning:pandas.*",
  "ignore:((.|\n)*)datetime\\.datetime\\.utcfromtimestamp((.|\n)*):DeprecationWarning:dateutil.*",
]
markers = [
  "slow: marks tests as slow (enable with '--run-slow')",
  "unstable: marks tests as being unstable (enable with --run-unstable)",
]
addopts = ["-p", "pytest_cov"]

[tool.coverage.run]
omit = [
  "*/lib-python/?.?/*.py",
  "*/lib_pypy/_*.py",
  "*/site-packages/ordereddict.py",
  "*/site-packages/nose/*",
  "*/unittest2/*",
]

[tool.coverage.report]
sort = "Cover"
ignore_errors = true
show_missing = true
exclude_lines = [
  "pragma: Python 3.8",
  "pragma: no cover",
  "pragma: debug",
  "pragma: in progress",
  "pragma: config",
  "pragma: completion",
  "pragma: testing",
  "pragma: version",
  "pragma: intermittent",
  "pragma: deprecated",
  "pragma: extern",
  "def __repr__",
  "def description_prefix",
  "if 0:",
  "if False:",
  "if __name__ == .__main__.:",
]

[tool.tox]
env_list = [
  "py3{10-14}",
]
skip_missing_interpreters = true

[tool.tox.env_run_base]
dependency_groups = [ "dev" ]
commands = [[ "pytest" ]]

[tool.cibuildwheel]
test-requires = ["pytest"]
test-command = "pytest -m {project}/tests"
# Based on embreex values
skip = "*i686 *-win32 *musllinux*"
manylinux-x86_64-image = "manylinux_2_28"

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312', 'py313', 'py314']
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | _version\.py
)/
'''


[tool.git-changelog]
template = "keepachangelog"
bump = "auto"
output = "CHANGELOG.md"
in-place = true
