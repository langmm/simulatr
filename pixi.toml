[workspace]
name = "simulatr"
version = "0.0.1"
description = "Gym environment for reinforcement learning using process-based simulators like crop growth models"
authors = ["Meagan Lang <langmm.astro@gmail.com>"]
channels = ["conda-forge"]
platforms = ["osx-64", "osx-arm64", "linux-64", "linux-aarch64", "win-64"]

[dependencies]
python = ">=3.10,<3.15"
fastapi = "*"
gymnasium = "*"
msgpack-python = "*"
numpy = ">=1.13.0"
pandas = "*"
pydantic = "*"
pydantic-settings = "*"
pyzmq = "*"
requests = "*"

[pypi-dependencies]
simulatr = { path = ".", editable = true }

[feature.dev.dependencies]
conda-index = "*"
flake8 = "*"
myst-parser = "*"
pytest = "*"
pytest-cov = "*"
python-build = "*"
sphinx = "*"
tox = "*"

[feature.dev.tasks]
test = { cmd = "pytest", description = "Run the test suite" }
lint = { cmd = "flake8 simulatr tests", description = "Lint the codebase" }
docs = { cmd = "sphinx-build docs docs/_build", description = "Build the documentation" }
build-conda = {
    cmd = "pixi publish --path recipe --target-dir build",
    description = "Build the conda package with pixi publish"
}
build-docker-server = {
    cmd = "docker build -f utils/Dockerfile.server --build-arg SIMULATOR={{ simulator }} -t {{ simulator }} .",
    args = [
      { arg = "simulator", default = "apsimx"},
    ],
    description = "Build a Docker image for launching a simulator server",
}
run-docker-server = {
    cmd = "docker run -p {{ port }}:8000 {{ simulator }}",
    args = [
      { arg = "simulator", default = "apsimx"},
      { arg = "port", default = "5000"},
    ],
    description = "Run a docker container launching a simulator server",
}

[feature.apsimx.dependencies]
dotnet = ">=8.0.0,<9.0.0"
gtk3 = "*"
git = "*"

[feature.py310.dependencies]
python = "3.10.*"
async-timeout = "*"

[feature.py311.dependencies]
python = "3.11.*"

[feature.py312.dependencies]
python = "3.12.*"

[feature.py313.dependencies]
python = "3.13.*"

[feature.py314.dependencies]
python = "3.14.*"

[environments]
default = []
py310 = ["dev", "py310", "apsimx"]
py311 = ["dev", "py311", "apsimx"]
py312 = ["dev", "py312", "apsimx"]
py313 = ["dev", "py313", "apsimx"]
py314 = ["dev", "py314", "apsimx"]
dev = ["dev", "py313", "apsimx"]
prod = ["py313", "apsimx"]